server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Identity-verification uploads can be up to ~5MB; allow headroom.
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Locally-stored files (Laravel's public disk). The shared "storage"
    # volume is mounted read-only into this container.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires max;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Sanctum bearer tokens: the Authorization header does not reach
        # PHP-FPM by default, so forward it explicitly.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
    }

    location ~* \.(css|js|map|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires max;
        log_not_found off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
